<h1>ブログ｜宿泊税対応の実務解説</h1>
<p>自治体の公式情報に基づき、小さな宿が宿泊税で間違えやすい点を解説します。著者：編集部</p>
<div class="post"><p><a href="tokyo-okinawa-tanusu.html">東京都と沖縄県の宿泊税は「端数処理」で税額が変わる――定率制の正しい計算</a></p><p>定率制では、料金にそのまま税率を掛けると税額が過大になることがあります。東京都は100円未満切り捨て後に3%、沖縄県は1,000円未満切り捨て後に2%（上限2,000円）という正しい順番を、例つきで解説します。</p></div>
